<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLB Current Rosters</title>
<style>
:root {
  --bg-primary: #0d1b2a;
  --bg-secondary: #1b2838;
  --bg-card: #faf3e0;
  --bg-card-inner: #fff8f0;
  --accent-red: #c41e3a;
  --accent-blue: #1a3a5c;
  --accent-gold: #d4a843;
  --text-light: #e8e8e8;
  --text-dark: #1a1a2e;
  --text-muted: #8899aa;
  --border-stitch: #c41e3a;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(26,58,92,0.3) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(196,30,58,0.08) 0%, transparent 40%);
  color: var(--text-light);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: linear-gradient(135deg, var(--bg-secondary), var(--accent-blue));
  padding: 1.2rem 2rem;
  border-bottom: 3px solid var(--accent-red);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header h1 {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(90deg, #fff, #ddd);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.season-badge {
  background: var(--accent-red);
  color: white;
  padding: 0.4rem 1rem;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.9rem;
}
.app-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}
.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 2rem;
  max-height: calc(100vh - 70px - 60px);
}
.nav-panel {
  width: 280px;
  background: var(--bg-secondary);
  border-left: 2px solid rgba(255,255,255,0.05);
  overflow-y: auto;
  padding: 1rem;
  max-height: calc(100vh - 70px - 60px);
}
.nav-panel h2 {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
  padding-left: 0.5rem;
}
.league-section { margin-bottom: 1.2rem; }
.league-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--accent-gold);
  padding: 0.5rem;
  border-bottom: 1px solid rgba(212,168,67,0.3);
  margin-bottom: 0.3rem;
}
.division-title {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  padding: 0.3rem 0.5rem;
  margin-top: 0.4rem;
}
.team-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  color: var(--text-light);
  padding: 0.5rem 0.7rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.88rem;
  transition: all 0.15s;
}
.team-btn:hover { background: rgba(255,255,255,0.08); }
.team-btn.active {
  background: var(--accent-red);
  color: white;
  font-weight: 600;
}
.team-overview {
  background: linear-gradient(135deg, var(--bg-secondary), rgba(26,58,92,0.8));
  border-radius: var(--radius);
  padding: 1.5rem 2rem;
  margin-bottom: 2rem;
  display: flex;
  align-items: center;
  gap: 2rem;
  border: 1px solid rgba(255,255,255,0.08);
}
.team-logo-container img {
  width: 80px;
  height: 80px;
  object-fit: contain;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
}
.team-info { flex: 1; }
.team-info h2 {
  font-size: 1.6rem;
  font-weight: 800;
  margin-bottom: 0.3rem;
}
.team-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-top: 0.5rem;
  font-size: 0.88rem;
  color: var(--text-muted);
}
.team-meta span { display: flex; align-items: center; gap: 0.3rem; }
.team-meta .label { color: var(--accent-gold); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
.team-stats-panel {
  display: flex;
  gap: 1.5rem;
  align-items: center;
}
.stat-box {
  text-align: center;
  padding: 0.5rem 1rem;
  background: rgba(0,0,0,0.2);
  border-radius: 8px;
  min-width: 70px;
}
.stat-box .stat-value {
  font-size: 1.2rem;
  font-weight: 800;
  color: white;
}
.stat-box .stat-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-top: 0.2rem;
}
.cards-section { margin-bottom: 2rem; }
.cards-section h3 {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 2px solid var(--accent-red);
  display: inline-block;
}
.pitcher-criteria {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 1rem;
  font-style: italic;
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
}
.player-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  position: relative;
  transition: transform 0.2s, box-shadow 0.2s;
  border: 2px solid transparent;
}
.player-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent-red);
  box-shadow: 0 8px 30px rgba(196,30,58,0.2);
}
.player-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent-red), #e8384f, var(--accent-red));
}
.player-card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: repeating-linear-gradient(
    90deg,
    var(--accent-red) 0px,
    var(--accent-red) 4px,
    transparent 4px,
    transparent 8px
  );
  opacity: 0.4;
}
.card-photo {
  width: 100%;
  height: 180px;
  object-fit: cover;
  object-position: top;
  background: #e8dcc8;
  display: block;
}
.card-body {
  padding: 0.8rem 1rem;
  color: var(--text-dark);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 0.4rem;
}
.card-name {
  font-size: 1rem;
  font-weight: 800;
  line-height: 1.2;
  color: var(--text-dark);
}
.card-number {
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--accent-red);
  line-height: 1;
}
.card-position {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #666;
  margin-bottom: 0.6rem;
}
.card-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.3rem 0.8rem;
  border-top: 1px dashed #ccc;
  padding-top: 0.5rem;
}
.card-stat {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
}
.card-stat .stat-key {
  color: #888;
  font-weight: 600;
  text-transform: uppercase;
  font-size: 0.7rem;
}
.card-stat .stat-val {
  font-weight: 700;
  color: var(--text-dark);
}
.remaining-roster {
  background: var(--bg-secondary);
  border-radius: var(--radius);
  padding: 1.5rem;
  border: 1px solid rgba(255,255,255,0.05);
}
.remaining-roster h3 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.roster-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 0.4rem;
}
.roster-item {
  font-size: 0.85rem;
  padding: 0.3rem 0.5rem;
  border-radius: 4px;
  color: var(--text-muted);
}
.roster-item:hover { background: rgba(255,255,255,0.04); }
.roster-item .ri-name { color: var(--text-light); font-weight: 600; }
.roster-item .ri-pos { color: var(--accent-gold); font-size: 0.75rem; margin-left: 0.3rem; }
.roster-item .ri-detail { color: var(--text-muted); font-size: 0.75rem; margin-left: 0.3rem; }
.loading-state, .error-state, .welcome-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 400px;
  text-align: center;
}
.loading-spinner {
  width: 40px;
  height: 40px;
  border: 4px solid rgba(255,255,255,0.1);
  border-top-color: var(--accent-red);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
.welcome-state h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
.welcome-state p { color: var(--text-muted); }
.error-state { color: var(--accent-red); }
.error-state button {
  margin-top: 1rem;
  padding: 0.5rem 1.5rem;
  background: var(--accent-red);
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}
footer {
  background: var(--bg-secondary);
  border-top: 1px solid rgba(255,255,255,0.05);
  padding: 0.8rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.75rem;
  color: var(--text-muted);
  min-height: 60px;
}
.footer-copyright { max-width: 60%; }
.footer-attribution { text-align: right; }
.photo-error {
  width: 100%;
  height: 180px;
  background: #e8dcc8;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #999;
  font-size: 0.8rem;
}
@media (max-width: 1200px) {
  .cards-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 900px) {
  .app-layout { flex-direction: column-reverse; }
  .nav-panel { width: 100%; max-height: 200px; border-left: none; border-top: 2px solid rgba(255,255,255,0.05); }
  .main-content { max-height: none; }
  .team-overview { flex-direction: column; text-align: center; }
  .team-stats-panel { flex-wrap: wrap; justify-content: center; }
}
</style>
</head>
<body>

<header>
  <h1>MLB Rosters</h1>
  <span class="season-badge" id="seasonBadge"></span>
</header>

<div class="app-layout">
  <main class="main-content" id="mainContent">
    <div class="welcome-state" id="welcomeState">
      <h2>Select a Team</h2>
      <p>Choose a team from the panel on the right to view their current roster.</p>
    </div>
  </main>

  <nav class="nav-panel" id="navPanel">
    <div class="loading-state" id="navLoading">
      <div class="loading-spinner"></div>
      <span>Loading teams...</span>
    </div>
  </nav>
</div>

<footer>
  <div class="footer-copyright" id="footerCopyright"></div>
  <div class="footer-attribution">
    Generated by Qwen 3.7 Max (opencode-go) &mdash; July 29, 2026
  </div>
</footer>

<script>
const API_BASE = 'https://statsapi.mlb.com/api/v1';
const PHOTO_BASE = 'https://img.mlbstatic.com/mlb-photos/image/upload/v1/people';
const LOGO_BASE = 'https://www.mlbstatic.com/team-logos';

const MASCOTS = {
  108: 'Rally Monkey', 109: 'Baxter the Bobcat', 110: 'The Oriole Bird',
  111: 'Wally the Green Monster', 112: 'Clark', 113: 'Mr. Redlegs',
  114: 'Slider', 115: 'Dinger the Dinosaur', 116: 'Paws',
  117: 'Orbit', 118: 'Sluggerrr', 119: undefined,
  120: 'Screech', 121: 'Mr. Met', 133: 'Stomper',
  134: 'Pirate Parrot', 135: 'Swinging Friar', 136: 'Mariner Moose',
  137: 'Lou Seal', 138: 'Fredbird', 139: 'Raymond',
  140: 'Rangers Captain', 141: 'Ace', 142: 'TC Bear',
  143: 'Phillie Phanatic', 144: 'Blooper', 145: 'Southpaw',
  146: 'Billy the Marlin', 147: undefined, 158: 'Bernie Brewer'
};

const POS_ORDER = ['C', '1B', '2B', '3B', 'SS', 'OF', 'OF', 'OF', 'DH'];
const OF_CODES = ['7', '8', '9'];

let state = {
  teams: [],
  standings: {},
  currentTeamId: null,
  season: new Date().getFullYear(),
  copyright: ''
};

async function init() {
  try {
    const [teamsRes, standingsRes] = await Promise.all([
      fetch(`${API_BASE}/teams?sportId=1`).then(r => r.json()),
      fetch(`${API_BASE}/standings?leagueId=103,104&season=${state.season}`).then(r => r.json())
    ]);

    state.copyright = teamsRes.copyright || '';
    document.getElementById('footerCopyright').textContent = state.copyright;

    state.teams = teamsRes.teams.filter(t => t.active);
    state.season = teamsRes.teams[0]?.season || state.season;
    document.getElementById('seasonBadge').textContent = `${state.season} Season`;

    if (standingsRes.records) {
      standingsRes.records.forEach(div => {
        div.teamRecords.forEach(tr => {
          state.standings[tr.team.id] = tr;
        });
      });
    }

    buildNav();
  } catch (err) {
    document.getElementById('navPanel').innerHTML = `
      <div class="error-state">
        <p>Failed to load teams.</p>
        <button onclick="init()">Retry</button>
      </div>`;
  }
}

function buildNav() {
  const nav = document.getElementById('navPanel');
  const leagues = { 'American League': {}, 'National League': {} };

  state.teams.forEach(team => {
    const lg = team.league.name;
    const div = team.division.name.replace(/(?:American|National)\s+League\s+/, '');
    if (!leagues[lg]) leagues[lg] = {};
    if (!leagues[lg][div]) leagues[lg][div] = [];
    leagues[lg][div].push(team);
  });

  let html = '';
  for (const [lgName, divisions] of Object.entries(leagues)) {
    html += `<div class="league-section">
      <div class="league-title">${lgName}</div>`;
    const divOrder = ['East', 'Central', 'West'];
    for (const divName of divOrder) {
      const teams = divisions[divName] || divisions[`${divName}`] || [];
      if (teams.length === 0) {
        const key = Object.keys(divisions).find(k => k.includes(divName));
        if (key) teams.push(...divisions[key]);
      }
      if (teams.length === 0) continue;
      html += `<div class="division-title">${divName}</div>`;
      teams.sort((a, b) => a.shortName.localeCompare(b.shortName));
      teams.forEach(team => {
        html += `<button class="team-btn" data-team-id="${team.id}" onclick="loadTeam(${team.id})">${team.shortName} ${team.teamName}</button>`;
      });
    }
    html += `</div>`;
  }
  nav.innerHTML = html;
}

async function loadTeam(teamId) {
  state.currentTeamId = teamId;
  document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.team-btn[data-team-id="${teamId}"]`)?.classList.add('active');

  const main = document.getElementById('mainContent');
  main.innerHTML = `<div class="loading-state"><div class="loading-spinner"></div><span>Loading roster...</span></div>`;

  try {
    const team = state.teams.find(t => t.id === teamId);
    const [rosterRes, coachesRes] = await Promise.all([
      fetch(`${API_BASE}/teams/${teamId}/roster`).then(r => r.json()),
      fetch(`${API_BASE}/teams/${teamId}/roster?rosterType=coach`).then(r => r.json())
    ]);

    const roster = rosterRes.roster || [];
    const manager = (coachesRes.roster || []).find(c => c.job === 'Manager');
    const record = state.standings[teamId];

    if (roster.length === 0) {
      main.innerHTML = `<div class="error-state"><p>No active roster available for this team.</p></div>`;
      return;
    }

    const playerIds = roster.map(p => p.person.id).join(',');
    const statsRes = await fetch(
      `${API_BASE}/people?personIds=${playerIds}&hydrate=stats(group=[hitting,pitching],type=season,season=${state.season})`
    ).then(r => r.json());

    const playerStats = {};
    (statsRes.people || []).forEach(p => {
      playerStats[p.id] = p;
    });

    const featured = selectFeatured(roster, playerStats);
    const featuredIds = new Set(featured.map(f => f.person.id));
    const remaining = roster.filter(p => !featuredIds.has(p.person.id));

    renderTeam(team, manager, record, featured, remaining, playerStats);
  } catch (err) {
    main.innerHTML = `<div class="error-state"><p>Failed to load roster: ${err.message}</p><button onclick="loadTeam(${teamId})">Retry</button></div>`;
  }
}

function selectFeatured(roster, playerStats) {
  const positionMap = { C: [], '1B': [], '2B': [], '3B': [], SS: [], OF: [], DH: [] };
  const pitchers = { starters: [], relievers: [] };

  roster.forEach(player => {
    const pos = player.position.abbreviation;
    const code = player.position.code;
    const stats = playerStats[player.person.id];
    const hittingStats = getHittingStats(stats);
    const pitchingStats = getPitchingStats(stats);

    if (code === '1') {
      if (pitchingStats) {
        const gs = pitchingStats.gamesStarted || 0;
        const gp = pitchingStats.gamesPlayed || pitchingStats.gamesPitched || 1;
        if (gs >= gp * 0.5) {
          pitchers.starters.push({ ...player, pitchingStats });
        } else {
          pitchers.relievers.push({ ...player, pitchingStats });
        }
      }
      return;
    }

    const pa = hittingStats?.plateAppearances || 0;
    if (OF_CODES.includes(code)) {
      positionMap.OF.push({ ...player, pa });
    } else if (pos === 'DH' || code === '10') {
      positionMap.DH.push({ ...player, pa });
    } else if (positionMap[pos]) {
      positionMap[pos].push({ ...player, pa });
    }
  });

  const featured = [];
  const positions = ['C', '1B', '2B', '3B', 'SS'];
  positions.forEach(pos => {
    const candidates = positionMap[pos].sort((a, b) => b.pa - a.pa);
    if (candidates[0]) featured.push({ ...candidates[0], role: pos });
  });

  const ofCandidates = positionMap.OF.sort((a, b) => b.pa - a.pa);
  for (let i = 0; i < 3 && i < ofCandidates.length; i++) {
    featured.push({ ...ofCandidates[i], role: 'OF' });
  }

  const dhCandidates = positionMap.DH.sort((a, b) => b.pa - a.pa);
  if (dhCandidates[0]) featured.push({ ...dhCandidates[0], role: 'DH' });

  while (featured.length < 9 && positionMap.OF.length > 3) {
    const next = positionMap.OF[featured.filter(f => f.role === 'OF').length];
    if (next) featured.push({ ...next, role: 'OF' });
    else break;
  }

  pitchers.starters.sort((a, b) => {
    const aScore = (a.pitchingStats.inningsPitched ? parseFloat(a.pitchingStats.inningsPitched) : 0) +
                   (a.pitchingStats.strikeOuts || 0) * 0.5 -
                   (parseFloat(a.pitchingStats.era) || 5) * 10;
    const bScore = (b.pitchingStats.inningsPitched ? parseFloat(b.pitchingStats.inningsPitched) : 0) +
                   (b.pitchingStats.strikeOuts || 0) * 0.5 -
                   (parseFloat(b.pitchingStats.era) || 5) * 10;
    return bScore - aScore;
  });

  pitchers.relievers.sort((a, b) => {
    const aScore = (a.pitchingStats.saves || 0) * 3 + (a.pitchingStats.strikeOuts || 0) * 0.5 -
                   (parseFloat(a.pitchingStats.era) || 5) * 5;
    const bScore = (b.pitchingStats.saves || 0) * 3 + (b.pitchingStats.strikeOuts || 0) * 0.5 -
                   (parseFloat(b.pitchingStats.era) || 5) * 5;
    return bScore - aScore;
  });

  const selectedPitchers = [];
  for (let i = 0; i < 2 && i < pitchers.starters.length; i++) {
    selectedPitchers.push({ ...pitchers.starters[i], role: 'SP' });
  }
  for (let i = 0; i < 1 && i < pitchers.relievers.length; i++) {
    selectedPitchers.push({ ...pitchers.relievers[i], role: 'RP' });
  }

  if (selectedPitchers.length < 3) {
    const allPitchers = [...pitchers.starters, ...pitchers.relievers]
      .filter(p => !selectedPitchers.find(s => s.person.id === p.person.id));
    allPitchers.sort((a, b) => {
      const aStats = a.pitchingStats;
      const bStats = b.pitchingStats;
      return (bStats.strikeOuts || 0) - (aStats.strikeOuts || 0);
    });
    while (selectedPitchers.length < 3 && allPitchers.length > 0) {
      const p = allPitchers.shift();
      const gs = p.pitchingStats.gamesStarted || 0;
      const gp = p.pitchingStats.gamesPlayed || p.pitchingStats.gamesPitched || 1;
      selectedPitchers.push({ ...p, role: gs >= gp * 0.5 ? 'SP' : 'RP' });
    }
  }

  return [...featured, ...selectedPitchers];
}

function getHittingStats(player) {
  if (!player?.stats) return null;
  const hitting = player.stats.find(s => s.group?.displayName === 'hitting');
  return hitting?.splits?.[0]?.stat || null;
}

function getPitchingStats(player) {
  if (!player?.stats) return null;
  const pitching = player.stats.find(s => s.group?.displayName === 'pitching');
  return pitching?.splits?.[0]?.stat || null;
}

function selectHitterStats(hittingStats) {
  const stats = [];
  stats.push({ key: 'AVG', value: hittingStats.avg || '.---' });
  stats.push({ key: 'HR', value: hittingStats.homeRuns ?? 0 });
  stats.push({ key: 'RBI', value: hittingStats.rbi ?? 0 });

  const sb = hittingStats.stolenBases || 0;
  const ops = parseFloat(hittingStats.ops) || 0;
  const runs = hittingStats.runs || 0;
  const obp = parseFloat(hittingStats.obp) || 0;

  if (sb >= 15) stats.push({ key: 'SB', value: sb });
  else if (ops >= 0.900) stats.push({ key: 'OPS', value: hittingStats.ops });
  else if (runs >= 50) stats.push({ key: 'R', value: runs });
  else if (obp >= 0.370) stats.push({ key: 'OBP', value: hittingStats.obp });
  else stats.push({ key: 'OPS', value: hittingStats.ops || '.---' });

  return stats;
}

function selectPitcherStats(pitchingStats, role) {
  const stats = [];
  stats.push({ key: 'ERA', value: pitchingStats.era || '-.--' });
  stats.push({ key: 'W-L', value: `${pitchingStats.wins || 0}-${pitchingStats.losses || 0}` });
  stats.push({ key: 'SO', value: pitchingStats.strikeOuts ?? 0 });

  if (role === 'RP') {
    stats.push({ key: 'SV', value: pitchingStats.saves ?? 0 });
  } else {
    stats.push({ key: 'WHIP', value: pitchingStats.whip || '-.--' });
  }

  return stats;
}

function renderTeam(team, manager, record, featured, remaining, playerStats) {
  const main = document.getElementById('mainContent');
  const mascot = MASCOTS[team.id];
  const rec = record || {};
  const lastTen = rec.records?.splitRecords?.find(s => s.type === 'lastTen');

  let overviewHtml = `
    <div class="team-overview">
      <div class="team-logo-container">
        <img src="${LOGO_BASE}/${team.id}.svg" alt="${team.name} logo" onerror="this.style.display='none'">
      </div>
      <div class="team-info">
        <h2>${team.name}</h2>
        <div class="team-meta">
          ${manager ? `<span><span class="label">Manager</span> ${manager.fullName}</span>` : ''}
          ${mascot ? `<span><span class="label">Mascot</span> ${mascot}</span>` : ''}
          <span><span class="label">Stadium</span> ${team.venue.name}</span>
        </div>
      </div>
      <div class="team-stats-panel">
        ${rec.wins != null ? `
          <div class="stat-box"><div class="stat-value">${rec.wins}-${rec.losses}</div><div class="stat-label">Record</div></div>
          <div class="stat-box"><div class="stat-value">${rec.streak?.streakCode || '-'}</div><div class="stat-label">Streak</div></div>
          <div class="stat-box"><div class="stat-value">${lastTen ? `${lastTen.wins}-${lastTen.losses}` : '-'}</div><div class="stat-label">L10</div></div>
          <div class="stat-box"><div class="stat-value">${rec.divisionRank ? '#' + rec.divisionRank : '-'}</div><div class="stat-label">Division</div></div>
        ` : ''}
      </div>
    </div>`;

  let cardsHtml = `<div class="cards-section">
    <h3>Featured Players</h3>
    <p class="pitcher-criteria">Pitchers selected by notability: starters by innings pitched, strikeouts, and ERA; relievers by saves, strikeouts, and ERA.</p>
    <div class="cards-grid">`;

  featured.forEach(f => {
    const player = playerStats[f.person.id];
    if (!player) return;
    const isPitcher = f.role === 'SP' || f.role === 'RP';
    const photoUrl = `${PHOTO_BASE}/${f.person.id}/headshot/67/current`;
    const cardStats = isPitcher
      ? selectPitcherStats(getPitchingStats(player) || {}, f.role)
      : selectHitterStats(getHittingStats(player) || {});

    const posLabel = f.role;

    cardsHtml += `
      <div class="player-card">
        <img class="card-photo" src="${photoUrl}" alt="${player.fullName}" onerror="handlePhotoError(this)">
        <div class="card-body">
          <div class="card-header">
            <span class="card-name">${player.fullName}</span>
            <span class="card-number">${player.primaryNumber || ''}</span>
          </div>
          <div class="card-position">${posLabel}</div>
          <div class="card-stats">
            ${cardStats.map(s => `<div class="card-stat"><span class="stat-key">${s.key}</span><span class="stat-val">${s.value}</span></div>`).join('')}
          </div>
        </div>
      </div>`;
  });

  cardsHtml += `</div></div>`;

  let remainingHtml = `<div class="remaining-roster">
    <h3>Full Roster (${remaining.length} additional players)</h3>
    <div class="roster-list">`;

  remaining.forEach(p => {
    const player = playerStats[p.person.id];
    const pos = p.position.abbreviation;
    let detail = '';
    if (player) {
      const hs = getHittingStats(player);
      const ps = getPitchingStats(player);
      if (ps) {
        detail = `ERA ${ps.era || '-.--'} | ${ps.wins || 0}-${ps.losses || 0}`;
      } else if (hs) {
        detail = `AVG ${hs.avg || '.---'} | ${hs.homeRuns || 0} HR`;
      }
    }
    remainingHtml += `<div class="roster-item">
      <span class="ri-name">${p.person.fullName}</span>
      <span class="ri-pos">${pos}</span>
      ${p.jerseyNumber ? `<span class="ri-detail">#${p.jerseyNumber}</span>` : ''}
      ${detail ? `<span class="ri-detail">${detail}</span>` : ''}
    </div>`;
  });

  remainingHtml += `</div></div>`;

  main.innerHTML = overviewHtml + cardsHtml + remainingHtml;
  main.scrollTop = 0;
}

function handlePhotoError(img) {
  const div = document.createElement('div');
  div.className = 'photo-error';
  div.textContent = 'Photo unavailable';
  img.replaceWith(div);
}

init();
</script>
</body>
</html>
