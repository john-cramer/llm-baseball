<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Current Rosters — Baseball Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header class="site-header">
            <div class="header-left">
                <span class="baseball-icon">&#9918;</span>
                <h1>MLB Current Rosters</h1>
            </div>
            <div class="header-right">
                <span id="season-label" class="season-label">Loading…</span>
            </div>
        </header>

        <div class="main-layout">
            <main id="content" class="content">
                <div id="welcome" class="welcome">
                    <div class="welcome-inner">
                        <span class="welcome-icon">&#9918;</span>
                        <h2>Select a team to view its roster</h2>
                        <p>Click any team in the panel on the right to see the current roster presented as baseball cards.</p>
                    </div>
                </div>
                <div id="team-view" style="display:none;">
                    <div id="team-overview" class="team-overview"></div>
                    <div id="pitcher-criteria" class="pitcher-criteria"></div>
                    <div id="player-cards" class="player-cards"></div>
                    <div id="remaining-roster" class="remaining-roster"></div>
                </div>
                <div id="loading" class="loading" style="display:none;">
                    <div class="spinner"></div>
                    <p>Loading roster…</p>
                </div>
                <div id="error" class="error" style="display:none;">
                    <p id="error-message"></p>
                </div>
            </main>

            <nav id="team-nav" class="team-nav">
                <div class="nav-header">Teams</div>
                <div id="nav-content"></div>
            </nav>
        </div>

        <footer class="site-footer">
            <div id="api-copyright" class="api-copyright"></div>
            <div class="self-attribution">
                Generated by <strong>GLM-5.2</strong> (Fireworks AI) on <span id="gen-date"></span>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
